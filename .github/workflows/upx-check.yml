name: UPX size A/B (manual verification only)

# ---------------------------------------------------------------------------
# 只用于独立复核，不作为发布门禁；也不参与任何 PR / push / tag 流程。
#
# 两种「再压一次」必须分开看：
#   * 对整个 PKG 再叠一层 UPX —— PyInstaller 6 已对每个归档条目做 zlib
#     压缩 (RangeChartAnalyzer.spec 实测 4334/4335 个条目 flag=1)，这一层
#     是近零收益，不做。
#   * 对进入 PKG **之前**的每个 .pyd / 第三方 DLL 单独 UPX —— 这不是同一
#     件事。0.4.1 用 lzma（UPX -9 的算法）实测：cv2.pyd 30.7 -> 20.7 MB、
#     openblas 6.4 -> 3.6、_rust.pyd 3.3 -> 2.5、QtOpenGL.pyd 2.2 -> 1.2，
#     非 Qt 二进制合计约 -15 MB。build.yml 现在默认启用 UPX。
#
# 2026-10-18 那次 258.8 -> 234.7 MB 的体积下降确实来自「排除 Qt 冗余 /
# 精简 datas」，不是 UPX 的功劳；但那次测的是另一条路径，不能用来否定
# 上面这组数字。
#
# 因此本 workflow 保留为**独立复核**：同一份 spec、同一台 runner 上构建
# 两次 —— A 不设 RCA_UPX_DIR，B 下载官方 UPX 并设置 RCA_UPX_DIR —— 把两个
# RangeChartAnalyzer.exe 的体积与差值打到日志和 job summary。它不设体积
# 断言、不阻断发布、不上传制品、不改动任何发布流程；build.yml 的数字若被
# 怀疑，跑这个复现即可。
#
# 触发方式：workflow_dispatch ONLY（手动，不设 PR / push gate）。
# ---------------------------------------------------------------------------
on:
  workflow_dispatch:
    inputs:
      upx_tag:
        description: "upx/upx release tag to A/B against (e.g. v5.3.0)"
        required: false
        default: "v5.3.0"
        type: string

permissions:
  contents: read

jobs:
  upx-compare:
    name: 同一 spec 的 UPX 开/关体积对照（独立复核，非门禁）
    runs-on: windows-latest
    timeout-minutes: 90 # 两次完整 onefile 构建，每次 10-20 分钟
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.10"

      # 这一步需要真实网络；本 workflow 不设任何代理。
      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller==6.22.0
          pip install -r requirements.txt

      # --- 构建 A：明确不启用 UPX。spec 会打印 "[spec] UPX disabled" ---
      - name: Build A - no UPX (RCA_UPX_DIR unset)
        env:
          RCA_UPX_DIR: ""
        shell: pwsh
        run: |
          # GitHub's pwsh wrapper sets $ErrorActionPreference='stop'; native
          # stderr (PyInstaller progress/warnings) would otherwise become a
          # terminating ErrorRecord. The real gate is $LASTEXITCODE below.
          $ErrorActionPreference = "Continue"
          python -m PyInstaller --noconfirm `
            --distpath dist-noupx --workpath build-noupx `
            RangeChartAnalyzer.spec 2>&1 | Tee-Object -FilePath build-a.log
          if ($LASTEXITCODE -ne 0) { throw "PyInstaller build A failed ($LASTEXITCODE)" }
          if (-not (Get-Content build-a.log -Raw).Contains("[spec] UPX disabled")) {
            throw "build A did not log '[spec] UPX disabled'; A/B would be meaningless"
          }

      # --- 取官方 UPX。gh 预装在 windows-latest，从 upx/upx 的固定 tag 取
      #     win64 zip，避免手写容易过期的 asset URL。RCA_UPX_DIR 必须是「含
      #     upx.exe 的目录」(见 spec: os.path.isfile(join(UPX_DIR,"upx.exe")))。
      - name: Download UPX (${{ inputs.upx_tag }}, official upx/upx win64)
        id: upx
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = "Continue"
          New-Item -ItemType Directory -Force -Path upx-dl, upx-extract | Out-Null
          gh release download "${{ inputs.upx_tag }}" `
            --repo upx/upx --pattern "upx-*-win64.zip" --dir upx-dl
          if ($LASTEXITCODE -ne 0) { throw "gh release download failed ($LASTEXITCODE)" }
          $zip = Get-ChildItem upx-dl -Filter "*.zip" | Select-Object -First 1
          if (-not $zip) { throw "no UPX win64 zip downloaded from upx/upx" }
          Expand-Archive -Path $zip.FullName -DestinationPath upx-extract -Force
          $exe = Get-ChildItem upx-extract -Recurse -Filter upx.exe |
                 Select-Object -First 1
          if (-not $exe) { throw "upx.exe not found inside $($zip.Name)" }
          "upx_dir=$($exe.DirectoryName)" |
            Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          Write-Host "RCA_UPX_DIR=$($exe.DirectoryName)"
          & $exe.FullName --version

      # --- 构建 B：同一 spec，仅多一个 RCA_UPX_DIR ---
      - name: Build B - with UPX (RCA_UPX_DIR set)
        env:
          RCA_UPX_DIR: ${{ steps.upx.outputs.upx_dir }}
        shell: pwsh
        run: |
          # Same reason as build A: keep native stderr from being fatal;
          # $LASTEXITCODE and the '[spec] UPX enabled' marker are the gates.
          $ErrorActionPreference = "Continue"
          python -m PyInstaller --noconfirm `
            --distpath dist-upx --workpath build-upx `
            RangeChartAnalyzer.spec 2>&1 | Tee-Object -FilePath build-b.log
          if ($LASTEXITCODE -ne 0) { throw "PyInstaller build B failed ($LASTEXITCODE)" }
          if (-not (Get-Content build-b.log -Raw).Contains("[spec] UPX enabled")) {
            throw "RCA_UPX_DIR was set but no '[spec] UPX enabled' line appeared; A/B would be meaningless"
          }

      - name: Report both exe sizes and the delta
        shell: pwsh
        run: |
          $a = Get-Item "dist-noupx/RangeChartAnalyzer.exe"
          $b = Get-Item "dist-upx/RangeChartAnalyzer.exe"
          $amb = [math]::Round($a.Length / 1MB, 1)
          $bmb = [math]::Round($b.Length / 1MB, 1)
          $delta = [math]::Round(($a.Length - $b.Length) / 1MB, 1)
          $pct = if ($a.Length -gt 0) {
            [math]::Round(100 * ($a.Length - $b.Length) / $a.Length, 2)
          } else { 0 }
          $lines = @(
            "UPX A/B (same spec, same runner; NOT a release gate)",
            "",
            "| build | RangeChartAnalyzer.exe |",
            "| --- | --- |",
            "| A: no UPX (RCA_UPX_DIR unset) | $amb MiB ($($a.Length) bytes) |",
            "| B: with UPX (RCA_UPX_DIR set) | $bmb MiB ($($b.Length) bytes) |",
            "| delta (A - B) | $delta MiB ($pct %) |"
          )
          $lines | ForEach-Object { Write-Host $_ }
          $lines | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8
