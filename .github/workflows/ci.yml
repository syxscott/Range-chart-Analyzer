name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.13 added 2026-11-07 (P1-7). 3.14 is deliberately NOT here:
        # PySide6 6.12's 3.14 compatibility is unverified, and adding an
        # unproven interpreter to the gate would introduce uncertainty for
        # no coverage gain. Revisit when the Qt stack is qualified on 3.14.
        python-version: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # ARCH-REVIEW D6: pin CI tooling. Unpinned pytest/ruff meant a
          # green run did not identify WHICH tool versions produced it,
          # and a ruff change could turn F821 into a red run unrelated
          # to any code change.
          pip install pytest==8.3.4 ruff==0.15.12
          # Optional deps used by tests (at-rest encryption, XLSX,
          # image enhancement). UI-REVIEW-2026-09-07: Pillow added -
          # tests/test_enhance.py used to error the whole collection
          # run when it was missing (CI red since 2026-08-19).
          pip install cryptography keyring openpyxl Pillow
          # FIX-2026-10-17: numpy was missing here, and the failure it caused
          # was INVISIBLE locally. rca_core/grid.py documents "DEPENDENCIES:
          # numpy + Pillow only", and tests/test_grid.py falls back to a
          # synthetic ruled table when _figtest/ is absent (it is gitignored,
          # so CI always takes that path; dev machines with a corpus do not).
          # detect_grid wraps its whole body in `except Exception: return
          # None`, so on CI the `import numpy` inside raised ImportError and
          # every geometry test errored with "the ruled source table must
          # produce a geometry" — while every dev machine (Anaconda) ships
          # numpy and stayed green. The tests could not catch it locally
          # because locally the real figure exists and numpy is installed;
          # both halves of that blind spot are environment, not code.
          pip install numpy
          # AUDIT-2026-09-27: PySide6 + qfluentwidgets are intentionally NOT
          # installed here. The desktop GUI's behavioural suites are Qt-gated
          # and would add ~200MB and several minutes to every matrix entry;
          # they run in the separate `qt` job below, which is the gate that
          # actually protects the GUI. The Qt-FREE contract suite
          # (tests/test_gui_page_contract.py) runs right here, so the
          # structural invariants the Qt suites depend on stay enforced on
          # every matrix entry.

      - name: Set up Node (frontend parity tests)
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      # MEASURED 2026-11-01, and the reason this line names only the
      # directory: `pytest tests/ tests/standalone/tests_core.py` runs 46
      # tests, not 4,406. When an explicitly-named file lives INSIDE a
      # directory passed on the same command line, pytest collects that file
      # alone and silently drops the directory -- no warning, exit 0. It did
      # work before the layout change purely because tests_core.py sat at the
      # repo root, i.e. outside `tests/`. Minimal repro: a/ + a/other.py
      # collects nothing, while a/ + ../other.py collects both.
      #
      # tests_core.py still runs in this job -- as a script, in its own step
      # below, where its exit code is the gate. Do not "restore" it here.
      #
      # P1-6 (2026-11-07, impl-qa): tests/standalone/conftest.py's
      # pytest_collect_file hook is DIRECTORY-LEVEL, so `pytest tests/` also
      # collects the 14 script-style suites as `standalone_script` items.
      # They have a dedicated step below (one item per file, child
      # interpreter, `standalone::<file>` failure attribution). Without this
      # -m they run TWICE per matrix entry (~37 s each, ~2 min/CI) and one
      # failure gets reported in both steps. Deselect them here so the
      # dedicated step is the single entry point -- same rationale as the
      # qt job's -m below. A local `pytest tests/` (no -m) still covers them,
      # so this does not re-introduce the "new suite is never collected" gap
      # P1-6 exists to close. Measured 2026-11-07: 4472 collected -> 4458
      # with this -m (exactly 14 deselected), 0 standalone nodeids, exit 0.
      - name: Run full pytest suite
        run: python -m pytest tests/ -q --tb=short -m "not standalone_script"

      # AUDIT-2026-09-29: F821 (undefined name) only, deliberately.
      #
      # Three rounds of line-by-line review had gone through server.py and
      # extractor.py without seeing either of these, and neither had a test:
      #
      #   server.py  _send_json called `_strip_nonfinite_shallow` unqualified
      #              while it is a @staticmethod ON THE CLASS, so the name
      #              never resolved and the NaN/Infinity fallback FIX-2026-09-22
      #              added for exactly those payloads had never once run --
      #              50 call sites, every non-finite response a 500.
      #   server.py  _handle_extract_body used prompt_version_for_mode with no
      #              binding in scope; the file's only import of it is inside
      #              another function, so every batched (runs > 1) extraction
      #              died while stamping its own provenance.
      #   extractor.py  the enhance helpers annotate "Image.Image" but Pillow
      #              was only ever imported function-locally, so
      #              typing.get_type_hints() raised NameError.
      #
      # F821 is the narrowest useful rule here: it is pure dead-name
      # detection with no style opinions, so it will not fight the codebase
      # the way the full default rule set does (176 unused-imports, most of
      # them __init__.py re-exports). A new F821 is a runtime NameError
      # waiting for the right input, which is exactly the class that shipped.
      - name: No undefined names (F821)
        run: |
          ruff check . --select F821 \
            --exclude node_modules,outputs,proxy,references \
            --output-format concise

      - name: Run tests_core standalone (exit code reflects failures)
        run: python tests/standalone/tests_core.py

      # The same file again, under pytest, and this is not redundant.
      #
      # The `__main__` driver calls its test functions in one unguarded
      # sequence: the first exception ends the run and every later test is
      # silently unexecuted (the exit code still fails, so the gate holds —
      # only the diagnosis is lost). Before the 2026-11-01 layout change both
      # modes ran in ONE invocation, `pytest tests/ tests_core.py`, which was
      # possible only because the file sat outside tests/. Merging them is no
      # longer possible (see the note on the full-suite step), so the
      # per-test isolation gets its own invocation instead of being dropped.
      - name: Run tests_core under pytest (per-test isolation)
        run: python -m pytest tests/standalone/tests_core.py -q --tb=short

      # Every Node suite, by directory walk rather than by hand-written list.
      #
      # REVIEW-2026-09-10 and AUDIT-2026-09-27 both found the same rot: a new
      # suite landed at the root and nothing executed it, so its assertions
      # could never fail. Both fixes appended the missing names to a list --
      # which rebuilt the trap each time, and the comment that said "a root
      # *.js suite added later must be added here too" WAS the trap, written
      # down. A glob cannot rot: a file dropped into tests/js/ runs the moment
      # it exists, and scripts/repo_health.py fails the weekly sweep if one is
      # ever added elsewhere.
      #
      # Two suites are excluded because this job lacks what they need:
      #   tests_frontend_perf.js        — a real browser; it has its own job.
      #   tests_diff_frontend_parity.js — its gate is a parsed divergence
      #                                   count, so it keeps a dedicated step.
      - name: Run every Node suite
        run: |
          set -e
          for f in tests/js/tests_*.js; do
            case "$f" in
              *tests_frontend_perf.js|*tests_diff_frontend_parity.js) continue ;;
            esac
            echo "=== $f ==="
            node "$f"
          done

      - name: Run the differential parity harness
        run: |
          # Replays fixtures generated from rca_core through the JS
          # normalizers. It prints a per-field table and always exits 0, so
          # the gate is its summary line's divergence count
          # ("... N matched, M documented, K diverged"). Cases the team has
          # consciously parked appear as SKIP lines and count as "documented",
          # not "diverged", so a newly introduced divergence fails the build.
          node tests/js/tests_diff_frontend_parity.js | tee /tmp/parity.log
          grep -E "[0-9]+ matched, [0-9]+ documented, [0-9]+ diverged" /tmp/parity.log
          if grep -qE "[1-9][0-9]* diverged" /tmp/parity.log; then
            echo "::error::Python/JS parity divergence detected"
            exit 1
          fi

      # REVIEW-2026-09-10: 14 root-level Python test files were outside
      # `testpaths = tests`, so nothing ran them. Each must exit non-zero on
      # failure (several print "N passed, M failed" and sys.exit accordingly).
      # tests_onboarding.py touches $HOME, so it runs with a scratch HOME to
      # keep it from depending on (or polluting) the runner's home directory.
      #
      # AUDIT-2026-09-27: a root *.py added later must be added here too.
      # `python_files = test_*.py` does not match `tests_*.py`, so pytest
      # never collects these on its own. This is the third recurrence of that
      # exact rot (Python side REVIEW-2026-09-10, JS side this round, and
      # root .py files here).
      - name: Run standalone Python suites (pytest, per-file isolation)
        run: |
          set -e
          # P1-6 (2026-11-07): tests/standalone/conftest.py now collects the
          # script-style tests_*.py suites as one pytest item PER FILE, via a
          # subprocess (not runpy: tests_gui_fluent.py calls os._exit(rc),
          # which would kill the pytest process itself). A collection error
          # under Qt 6.8.3 is also impossible this way, because each script
          # runs in its own interpreter and the qt job excludes this marker
          # below. The script entry point `python <file>` is unchanged and is
          # still what the qt job uses for its four GUI suites.
          #
          # tests_core.py is excluded (it has real test_* functions and runs in
          # its own two steps above), tests_real_corpus.py needs 299 MB of
          # copyrighted figures + a live API key, and tests_onboarding.py
          # needs a scratch HOME (dedicated step below). See conftest.py.
          python -m pytest tests/standalone/ -q --tb=short

      - name: Run tests_onboarding with a scratch HOME
        run: |
          set -e
          _scratch_home="$(mktemp -d)"
          HOME="$_scratch_home" python tests/standalone/tests_onboarding.py
          rm -rf "$_scratch_home"

      - name: Verify gold canned responses are committed
        run: |
          python tests/fixtures/gold/_gen_canned.py >/dev/null
          git diff --exit-code -- tests/fixtures/gold/

  # ---------------------------------------------------------------------
  # P1-7 (2026-11-07): 这是「无外网前提下的核心路径冒烟」，不是网络策略测试。
  #
  # 把代理指向 127.0.0.1:1（必然不可达）只是为了制造一个「没有外网」的
  # 前提，证明 doctor / extract --help / tests/test_cli.py 这三条核心路径
  # 不依赖外网即可跑完。它不验证代理自身的拦截行为，也不对任何网络策略
  # 做断言 —— 网络策略由 rca_core/ssrf.py 及其自动化测试覆盖，与本 job 无关。
  #
  # 代理必须在依赖安装之后设置：否则 pip 也会走这个死代理而失败。
  # 不复用上面的 test job：矩阵里每条都要装 Qt / 跑全量套件，而这里只需要
  # 一条 3.12 上的核心路径证据，单独一个 job 更快也更好归因。
  # ---------------------------------------------------------------------
  offline-smoke:
    name: 核心路径无外网冒烟 / core-path offline smoke (NOT a network-policy test)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      # 此步必须用真实网络装依赖；代理在下一步才设置。
      - name: Install dependencies (network ON)
        run: |
          python -m pip install --upgrade pip
          pip install pytest==8.3.4 cryptography keyring openpyxl Pillow numpy

      - name: Core paths work with no external network
        env:
          HTTP_PROXY: "http://127.0.0.1:1"
          HTTPS_PROXY: "http://127.0.0.1:1"
          ALL_PROXY: "http://127.0.0.1:1"
          NO_PROXY: ""
          http_proxy: "http://127.0.0.1:1"
          https_proxy: "http://127.0.0.1:1"
          all_proxy: "http://127.0.0.1:1"
          no_proxy: ""
        run: |
          # 1) doctor 是只读体检，本就不联网。允许 rc 0 或 1（1 表示体检
          #    发现某项不满足，如缺少 keyring 后端），但输出必须含「体检」
          #    与「encryption_status」；不满足即视为核心路径本身坏了。
          set +e
          doc_out="$(python main.py doctor 2>&1)"
          doc_rc=$?
          set -e
          printf '%s\n' "$doc_out"
          if [ "$doc_rc" -ne 0 ] && [ "$doc_rc" -ne 1 ]; then
            echo "::error::doctor exited $doc_rc (expected 0 or 1)"
            exit 1
          fi
          grep -q "体检" <<< "$doc_out" || {
            echo "::error::doctor output missing 体检"; exit 1; }
          grep -q "encryption_status" <<< "$doc_out" || {
            echo "::error::doctor output missing encryption_status"; exit 1; }

          # 2) extract --help 走 argparse，不联网、不写文件、不需要 Qt。
          python main.py extract --help

          # 3) tests/test_cli.py 把真实 LLM 调用 / ProviderStore /
          #    resolve_auto_mode 全部 stub 掉了，不联网。
          python -m pytest tests/test_cli.py -q --tb=short

  # AUDIT-2026-09-27 [item 0.4]: the desktop GUI had ZERO effective assertion
  # coverage in CI. Three gates were open at the same time:
  #   (a) PySide6 was not installed, so every Qt-gated suite skipped silently;
  #   (b) tests_gui_fluent.py's `check()` only PRINTED and had no autouse
  #       fixture, so under pytest its soft assertions passed unconditionally
  #       — including all four page-objectName pins;
  #   (c) its two halves were disjoint (run_all() never called any test_*,
  #       pytest never called run_all()), so no single path ran both.
  # (a) is fixed by this job; (b) and (c) were fixed in tests_gui_fluent.py
  # itself (its check() now feeds an autouse guard, run_all() now calls every
  # test_*, and the window contract moved into a real test function so pytest
  # sees it too).
  #
  # Kept out of the matrix on purpose: ~200MB of Qt plus the headless
  # WebEngine setup should not slow down every Python version, and a Qt failure
  # should be attributable to Qt rather than to the project.
  qt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.10"

      - name: Install Qt system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libxkbcommon-x11-0 libdbus-1-3 libxcb-cursor0 \
            libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 \
            libxcb-render-util0 libxcb-shape0 libxcb-xinerama0 libfontconfig1

      - name: Install Python + Qt dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest cryptography keyring openpyxl Pillow
          pip install PySide6 PySide6-Fluent-Widgets
          # PhyloTreeWidget is a QWebEngineView. Without Addons the GUI takes
          # its documented no-engine fallback, which is a legitimate build but
          # leaves the WebEngine teardown path untested.
          pip install PySide6-Addons

      - name: Run the GUI contract suite (needs no Qt)
        run: python -m pytest tests/test_gui_page_contract.py -v --tb=short

      - name: Run the Qt-gated GUI suites (headless)
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          # Qt resolves ZERO font families under the offscreen plugin, so text
          # metrics are meaningless there. Nothing asserted here depends on
          # glyphs; the full-resolution visual pass is a local concern and uses
          # QT_QPA_PLATFORM=windows instead.
          #
          # AUDIT-2026-09-28: the scratch HOME is not paranoia about this
          # runner -- it is about the developer who runs the same command
          # locally. Constructing a RangeChartFluentWindow schedules
          # maybe_show_onboarding (gui_fluent.py), whose closeEvent
          # unconditionally calls mark_onboarding_seen, so this suite was
          # writing ~/.range_chart_analyzer/onboarding_seen into the home of
          # whoever ran it.
          #
          # P1-6 (2026-11-07, impl-qa): tests/standalone/conftest.py now
          # collects the script-style tests_*.py suites as pytest items marked
          # `standalone_script`. Without the -m below, this -k expression also
          # selects tests/standalone/tests_gui_fluent.py::tests_gui_fluent.py
          # (its nodeid contains "gui"/"fluent"), i.e. a SECOND copy of that
          # GUI script would run inside this Qt-enabled pytest process. That
          # script ends its __main__ block with os._exit(rc) to dodge a
          # QWebEngineView teardown access violation -- in-process it would
          # take the whole gate down. Deselect all 14 script items here; the
          # dedicated "Run root-level GUI suites standalone" step below still
          # runs the four GUI scripts the intended way, in child processes.
          # Verified locally: -k alone selects that item, -k + this -m selects
          # none of the standalone items (0 collected).
          _scratch_home="$(mktemp -d)"
          HOME="$_scratch_home" python -m pytest tests/ -q --tb=short \
            -k "gui or fluent or dwc_archive or table_widgets" \
            -m "not standalone_script"
          rc=$?
          rm -rf "$_scratch_home"
          exit $rc

      - name: Run root-level GUI suites standalone
        # AUDIT-2026-09-27: for these files the EXIT CODE is the only thing
        # that reflects the soft assertions, so each must be run as a script
        # (pytest would not collect them: python_files = test_*.py does not
        # match tests_*.py) and `set -e` must propagate the failure.
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          set -e
          for f in tests/standalone/tests_gui_fluent.py tests/standalone/tests_drag.py tests/standalone/tests_history.py \
                   tests/standalone/tests_modern_ui.py; do
            echo "=== $f ==="
            python "$f"
          done
          # AUDIT-2026-09-28: tests_onboarding.py must NOT be in the loop
          # above, and this is the reason the matrix job already takes it out
          # of its loop too. `test_seen_round_trip` asserts `before is False`,
          # i.e. that the onboarding marker does not yet exist -- but the Qt
          # step in this very job has already created one, because every
          # window that step builds marks onboarding as seen on close. Given
          # the real HOME the assertion sees `before is True` and fails. The
          # scratch HOME below is the fix the matrix job uses; this job
          # originally reused the real one and went red on its first run.
          echo "=== tests/standalone/tests_onboarding.py (scratch HOME) ==="
          _scratch_home="$(mktemp -d)"
          HOME="$_scratch_home" python tests/standalone/tests_onboarding.py
          rm -rf "$_scratch_home"

  # UX-2026-10-18 (WEB-04): the browser performance / containment regression
  # suite. It is a SEPARATE JOB on purpose.
  #
  #   * It needs a real browser engine. Every other Node suite in this repo
  #     runs against a hand-written DOM stub (tests_frontend.js:66
  #     buildContext(), tests_edit_history.js:1042 fillDom()) -- a stub has no
  #     CSS engine, no layout engine and no box model, so it cannot observe
  #     column drift, row clipping, print layout or containment at all. That
  #     blind spot is why 3654 assertions could stay green while the 5000-row
  #     result panel froze the main thread for 1.07 s and while a containment
  #     change clipped every wrapped cell in the panel.
  #
  #   * It must not slow the Python matrix. The matrix job runs twice (3.10,
  #     3.12) and every one of those entries would otherwise pay for a
  #     ~150 MB browser download plus a browser launch, to test something only
  #     one of them could fail. One dedicated job, no matrix.
  #
  #   * The repo has NO package.json (node_modules/ is gitignored), so this
  #     job installs playwright itself rather than expecting it to be there.
  #     That also pins the browser version HERE instead of inheriting it from
  #     an unpinned local install.
  #
  # The suite exits non-zero on failure and does NOT use continue-on-error: a
  # performance gate that can go red without blocking anything is not a gate.
  # If it ever needs to be advisory, the honest form is `continue-on-error:
  # true` ON THE JOB plus a visible note -- never a silent skip inside the
  # test.
  browser-perf:
    name: browser perf / containment regression (node + chromium)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Install playwright + chromium
        run: |
          # No package.json in the repo, so install into the workspace and
          # point NODE_PATH at it (the suite resolves playwright through
          # NODE_PATH first, then ./node_modules, then cwd/node_modules).
          npm install --no-save --no-package-lock playwright@1.62.1
          npx playwright install --with-deps chromium

      - name: Run tests_frontend_perf.js
        env:
          NODE_PATH: ${{ github.workspace }}/node_modules
        run: |
          # Full run, not --quick: the 5000-row cases are the ones that carry
          # the column-drift and print-layout assertions, and --quick skips
          # exactly those. A quick-mode CI run would be a green run that
          # tested almost nothing.
          node tests/js/tests_frontend_perf.js

  # ---------------------------------------------------------------------
  # ARCH-REVIEW-2026-11-02 / GAP M2, M3: the green tick used to say nothing
  # about the dependency set a user actually installs. No workflow read
  # requirements.txt, and sv_ttk / pywebview / matplotlib had ZERO coverage:
  # CHANGELOG.md said of their Dependabot PRs "their green PRs were not
  # evidence". This job makes the CI dependency set equal to the user's.
  # Single Python version on purpose -- this checks installation and API
  # compatibility, not behaviour (the matrix job above does behaviour).
  # ---------------------------------------------------------------------
  deps:
    name: optional dependencies install and work
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install the documented dependency set
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Every optional dependency imports
        run: |
          python - <<'PY'
          import importlib
          for name in ("PIL", "sv_ttk", "webview", "openpyxl", "lxml",
                       "matplotlib", "cryptography", "keyring", "numpy"):
              importlib.import_module(name)
              print(f"import {name}: OK")
          PY

      - name: Optional dependencies still expose the APIs the app calls
        run: |
          python - <<'PY'
          import inspect
          import io

          # sv_ttk: gui.py calls set_theme("light"). Do NOT construct a Tk
          # root here -- ubuntu-latest has no DISPLAY, and a headless Tk()
          # failure would be a false red. The real set/get_theme round-trip
          # was verified locally on 2026-11-02 (see requirements.txt comment).
          import sv_ttk
          assert callable(sv_ttk.set_theme) and callable(sv_ttk.get_theme)

          # matplotlib: redraw_range_chart / the Usage page use Agg + savefig.
          import matplotlib
          matplotlib.use("Agg")
          import matplotlib.pyplot as plt
          fig, ax = plt.subplots()
          ax.plot([0, 1], [0, 1])
          buf = io.BytesIO()
          fig.savefig(buf, format="png")
          plt.close(fig)
          assert len(buf.getvalue()) > 1000, "matplotlib produced no PNG"

          # pywebview: app.py calls create_window(title, url=, width=,
          # height=, min_size=) and webview.start(). A renamed kwarg must
          # fail here rather than on a user's desktop.
          import webview
          params = inspect.signature(webview.create_window).parameters
          for kw in ("url", "width", "height", "min_size"):
              assert kw in params, f"webview.create_window lost {kw}"
          assert callable(webview.start)
          print("optional dependency APIs: OK")
          PY

      - name: Version / CHANGELOG / CITATION agree (every commit)
        run: python scripts/release_check.py --check

      # E4: proxy/ ships two deployment scripts (Cloudflare Worker, Deno)
      # that were EXCLUDED from the ruff sweep and had no CI coverage at all.
      # They share an interface with js/minimax.js, so a syntax break there
      # would only be found by someone deploying to production.
      - name: Set up Node for proxy checks
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Check proxy scripts
        run: |
          for f in proxy/*.js; do
            node --check "$f" || exit 1
            echo "syntax OK: $f"
          done
