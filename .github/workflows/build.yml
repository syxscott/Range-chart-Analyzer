name: Build and smoke-test the Windows executables

# ARCH-REVIEW-2026-11-02 (devops A2): the published artifact was NEVER
# verified by any automatic check. ci.yml installs no PyInstaller, and
# tests/test_payload_policy.py:72,115 skip with "needs a real build's xref
# (CI does not build onefile)". A broken spec, a missing resource, or the
# silent UPX-disabled fallback could only be discovered by a user double
# clicking the exe.
#
# A onefile build takes 10-20 minutes and ~250 MB of Qt, so it is NOT in
# ci.yml (a Windows-only build failure must not block the Linux test matrix)
# and its pull_request trigger is PATH-LIMITED to the files that can actually
# change the artifact -- see `on.pull_request.paths` below. It runs
# automatically on every version tag and manually before a release.
on:
  workflow_dispatch:
  push:
    tags: ["v*"]
  # P1-7 (2026-11-07): a *controlled* PR gate. Without `paths`, every PR --
  # docs, front-end, tests -- would pay for a 10-20 min Windows build. Only
  # PRs touching a real build input trigger it; everything else is covered
  # by the Linux matrix in ci.yml. Keep this list in sync with the spec's
  # inputs (RangeChartAnalyzer.spec + whatever it imports / bundles).
  pull_request:
    paths:
      - "RangeChartAnalyzer.spec"
      - "requirements.txt"
      - "constraints.txt"
      - "main.py"
      - "rca_core/**"
      - ".github/workflows/build.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 45
    # v0.4.1: a tag build publishes the exe, so THIS job needs write access
    # to the Release. Scoped to the job, not the workflow: a PR build only
    # reads the repository.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.10"

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller==6.22.0
          pip install -r requirements.txt
          pip install pytest

      # v0.4.1: UPX is ON for every build. The old "near-zero gain" note
      # conflated two different operations: re-compressing the already
      # zlib'd PKG buys nothing, but compressing each .pyd BEFORE it enters
      # the PKG buys a lot. Measured on this payload with lzma (UPX's -9
      # algorithm): cv2.pyd 30.7 -> 20.7 MB, openblas 6.4 -> 3.6,
      # _rust.pyd 3.3 -> 2.5, QtOpenGL.pyd 2.2 -> 1.2 -- roughly 15 MB
      # across the non-Qt binaries. The spec's UPX_EXCLUDE keeps every
      # Qt6*.dll, the interpreter, the MS runtime and OpenSSL out: that is
      # exactly the class of binary behind "it worked until I added UPX".
      - name: Download UPX
        id: upx
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          New-Item -ItemType Directory -Force -Path upx-dl, upx-extract | Out-Null
          gh release download v5.3.0 --repo upx/upx `
            --pattern "upx-*-win64.zip" --dir upx-dl
          if ($LASTEXITCODE -ne 0) { throw "gh release download failed ($LASTEXITCODE)" }
          $zip = Get-ChildItem upx-dl -Filter "*.zip" | Select-Object -First 1
          if (-not $zip) { throw "no UPX win64 zip downloaded from upx/upx" }
          Expand-Archive -Path $zip.FullName -DestinationPath upx-extract -Force
          $exe = Get-ChildItem upx-extract -Recurse -Filter upx.exe |
                 Select-Object -First 1
          if (-not $exe) { throw "upx.exe not found inside $($zip.Name)" }
          "upx_dir=$($exe.DirectoryName)" |
            Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          & $exe.FullName --version

      - name: Build both executables
        env:
          RCA_UPX_DIR: ${{ steps.upx.outputs.upx_dir }}
        shell: pwsh
        run: |
          # GitHub's pwsh wrapper sets $ErrorActionPreference='stop'; native
          # stderr (PyInstaller progress/warnings) would otherwise become a
          # terminating ErrorRecord. The real gates are $LASTEXITCODE and the
          # '[spec] UPX enabled' marker.
          $ErrorActionPreference = "Continue"
          python -m PyInstaller --noconfirm RangeChartAnalyzer.spec 2>&1 |
            Tee-Object -FilePath build.log
          if ($LASTEXITCODE -ne 0) { throw "PyInstaller failed ($LASTEXITCODE)" }
          if (-not (Get-Content build.log -Raw).Contains("[spec] UPX enabled")) {
            throw "RCA_UPX_DIR was set but no '[spec] UPX enabled' line appeared; the exe would ship uncompressed"
          }

      - name: Assert artifacts exist and are plausible
        shell: pwsh
        run: |
          $names = @("RangeChartAnalyzer.exe", "RangeChartAnalyzer-console.exe")
          foreach ($n in $names) {
            $p = Join-Path "dist" $n
            if (-not (Test-Path $p)) { throw "missing artifact: $p" }
            $mb = [math]::Round((Get-Item $p).Length / 1MB, 1)
            if ($mb -lt 20) { throw "$n is only $mb MiB - build looks truncated" }
            Write-Host "$n : $mb MiB"
          }

      - name: Smoke test the console build (real HTTP server)
        shell: pwsh
        run: |
          $exe = (Resolve-Path "dist/RangeChartAnalyzer-console.exe").Path
          $p = Start-Process -FilePath $exe `
              -ArgumentList "server","--port","8899","--no-browser" `
              -PassThru
          try {
            $ok = $false
            for ($i = 0; $i -lt 20; $i++) {
              Start-Sleep -Seconds 2
              try {
                $r = Invoke-WebRequest "http://127.0.0.1:8899/health" `
                     -UseBasicParsing -TimeoutSec 3
                if ($r.StatusCode -eq 200) { $ok = $true; break }
              } catch { }
            }
            if (-not $ok) { throw "health endpoint never answered 200" }
            Write-Host "SMOKE OK: /health returned 200"
          } finally {
            Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
          }

      - name: Verify the packaged resources are actually present
        shell: pwsh
        run: |
          # PyInstaller does not error when a datas= entry points at a file
          # that moved; the exe starts and only fails when the user exports
          # an ICS age. Assert the source files exist before the build is
          # considered good.
          $required = @(
            "rca_core/resources/ics_2024.json",
            "index.html"
          )
          foreach ($r in $required) {
            if (-not (Test-Path $r)) { throw "required packaged resource missing: $r" }
          }
          Write-Host "packaged resources present"

      - name: Run the payload policy checks against the real build
        # The xref now exists, so the two skipif guards in
        # tests/test_payload_policy.py resolve and the checks actually run.
        run: python -m pytest tests/test_payload_policy.py -q --tb=short

      # v0.4.1: the release used to be a tag with NO downloadable artifact
      # (v0.4.0 shipped with an empty asset list). Every build now exposes
      # the exe as a workflow artifact, so a release candidate can be
      # downloaded and exercised before it is tagged.
      - name: Upload the windowed executable as a workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: RangeChartAnalyzer-win64
          path: dist/RangeChartAnalyzer.exe
          if-no-files-found: error
          retention-days: 14

      # Only a tag publishes. `gh release view` fails on a tag that has no
      # release yet (the normal case: the tag is pushed before the Release
      # is written), so create it first and let the upload follow.
      - name: Attach the executable to the GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ github.ref_name }}"
          $asset = "RangeChartAnalyzer-$tag-win64.exe"
          Copy-Item dist/RangeChartAnalyzer.exe "dist/$asset"
          $size = [math]::Round((Get-Item "dist/$asset").Length / 1MB, 1)
          Write-Host "uploading $asset ($size MiB)"
          gh release view $tag 2>$null | Out-Null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag --title "$tag" --generate-notes
          }
          gh release upload $tag "dist/$asset" --clobber
          if ($LASTEXITCODE -ne 0) { throw "gh release upload failed ($LASTEXITCODE)" }
